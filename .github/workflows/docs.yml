name: Documentation contracts
on:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'scripts/check-docs.mjs'
      - 'scripts/check-agent-orchestration.mjs'
      - 'agents/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'scripts/check-docs.mjs'
      - 'scripts/check-agent-orchestration.mjs'
      - 'agents/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate documentation structure and local links
        run: |
          node scripts/check-docs.mjs
          node scripts/check-agent-orchestration.mjs
